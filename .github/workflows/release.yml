name: Release npm

on:
  release:
    types: [published]

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish npm package
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Release tag must start with v: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable semantic versions are published: ${tag_version}" >&2
            exit 1
          fi
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Release tag ${tag_version} does not match package version ${package_version}" >&2
            exit 1
          fi
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published" >&2
            exit 1
          fi

      - run: bun run release:check
      - run: npm publish
